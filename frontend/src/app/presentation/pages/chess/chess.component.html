<section class="shared-container relative justify-center chess-container">
  <app-game-bar
    class="absolute top-0 left-0"
    title="Chess"
    (pause)="controller.isPaused = true"
  />
  <chess-game-board>
    <chess-card-player
      top
      [player]="topPlayer"
      [label]="playerLabel(topPlayer)"
      [tag]="turnTag(topPlayer)"
      [active]="controller.playerTurn === topPlayer"
    ></chess-card-player>
    <ng-container>
      @for (x of drawOrder; track x) { @for (y of drawOrder; track y) {
      <chess-square
        (clickSquare)="move($event)"
        (dragPiece)="dragMove($event)"
        [row]="x"
        [column]="y"
        [flipped]="flipped"
        [locked]="controller.isBotTurn"
        [piece]="chessBoardView[x][y]"
        [player]="controller.playerTurn"
        [isSquarePromotionSquare]="isSquarePromotionSquare(x, y)"
        [isSquareChecked]="isSquareChecked(x, y)"
        [isSquareSelected]="isSquareSelected(x, y)"
        [isSquareLastMove]="isSquareLastMove(x, y)"
        [isSquareSafeForSelectedPiece]="isSquareSafeForSelectedPiece(x, y)"
      ></chess-square>
      } } @if(isPromotionActive){
      <chess-promotion-dialog
        [player]="currentPlayer"
        (closeDialog)="closePawnPromotionDialog()"
        (promote)="promotePiece($event)"
      ></chess-promotion-dialog>
      }
    </ng-container>
    <chess-card-player
      bottom
      [player]="bottomPlayer"
      [label]="playerLabel(bottomPlayer)"
      [tag]="turnTag(bottomPlayer)"
      [active]="controller.playerTurn === bottomPlayer"
    ></chess-card-player>
  </chess-game-board>
  <chess-side-controller
    [pointer]="controller.gameHistory.gameHistoryPointer"
    [lastPointer]="livePointer"
    [canUndo]="controller.canUndo"
    (navigate)="showPreviousPosition($event)"
    (undo)="undoMove()"
    (reset)="restartGame()"
  >
    <chess-move-list
      [moveList]="controller.gameHistory.moveList"
      [pointer]="controller.gameHistory.gameHistoryPointer"
      (showPreviousPositionEvent)="showPreviousPosition($event)"
    ></chess-move-list>
  </chess-side-controller>
</section>

@if(!controller.started || controller.isPaused){
<welcome-chess-modal></welcome-chess-modal>
} @if(controller.isGameOver){
<endgame-modal-chess (undo)="undoMove()"></endgame-modal-chess>
}
