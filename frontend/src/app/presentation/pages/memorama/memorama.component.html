<section class="shared-container">
  <app-game-bar title="Memorama" (pause)="controller.pause()" />

  <main
    class="table"
    [class.paused]="controller.isPaused || controller.isGameOver"
  >
    <div class="hud">
      <dl class="readouts">
        <div class="readout">
          <dt>Time</dt>
          <dd><chronometer></chronometer></dd>
        </div>
        <div class="readout">
          <dt>Successes</dt>
          <dd>{{ controller.success }} / {{ pairs }}</dd>
        </div>
        <div class="readout readout-end">
          <dt>Movements</dt>
          <dd>{{ controller.currentAttempts }}</dd>
        </div>
      </dl>

      <!-- The minute the round lasts, draining. A new element per round
           is what restarts the animation. -->
      <div class="time-bar" aria-hidden="true">
        @for (current of [round()]; track current) {
        <span class="time-left"></span>
        }
      </div>
    </div>

    <div id="game-memorama" class="game">
      @for (card of this.cards; track $index) {
      <button
        type="button"
        class="game-card rotate"
        [class.is-matched]="matched().has($index)"
        [class.is-wrong]="missed().has($index)"
        [style.--accent]="art($index).accent"
        [style.--i]="$index"
        [attr.aria-label]="label($index)"
        (click)="pick($event, $index)"
      >
        <div class="content">
          <div class="back" aria-hidden="true">?</div>
          <!-- The game tells a pair by comparing the text of the two
               faces, so the value stays in the face as text. -->
          <div class="face" aria-hidden="true">
            <app-pixel-emblem [map]="art($index).emblem" />
            <span class="sr-only">{{ controller.valueUsed[$index] }}</span>
          </div>
        </div>
      </button>
      }
    </div>
  </main>
</section>
@if(this.controller.isPaused){
<welcome-momerama-modal [resuming]="started()"></welcome-momerama-modal>
} @if(this.controller.isGameOver){
<endgame-modal-memorama></endgame-modal-memorama>
}
