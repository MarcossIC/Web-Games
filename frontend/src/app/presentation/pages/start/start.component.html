<main class="start" [class.is-leaving]="travel.leaving()">
  <h1 class="wordmark select-none">Game<br />Galaxy</h1>
  <p class="lead">
    Classic games on the Web. No account, no lobby. Pick a game and play.
  </p>
  <a class="cta" href="/games" (click)="travel.follow($event, '/games')">
    <span class="caret" aria-hidden="true">&gt;</span>
    Play Games
  </a>
</main>
