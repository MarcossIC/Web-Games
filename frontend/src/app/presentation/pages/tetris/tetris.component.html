<section
  class="shared-container relative"
  [ngClass]="{ 'opacity-95': this.controller.gameOver }"
>
  <app-game-bar title="Tetris" (pause)="pause()" />

  <main #playArea class="shared-wrapper">
    <div class="game-container" (pointerdown)="clickToRotate($event)">
      <canvas #tetris></canvas>
    </div>

    <div class="info-container">
      <ul>
        <li class="next">
          <h2 class="point-title menu-logo">Next</h2>
          <canvas #nextPiece></canvas>
        </li>
        <li class="score">
          <h2 class="point-title menu-logo">Score</h2>
          <span class="text-base min-[600px]:text-2xl min-[1500px]:text-3xl">{{
            this.point.score
          }}</span>
        </li>
        <li class="lines">
          <h2 class="point-title menu-logo">Level</h2>
          <span class="text-base min-[600px]:text-2xl min-[1500px]:text-3xl">{{
            this.controller.level
          }}</span>
        </li>
        <li class="times">
          <h2 class="point-title menu-logo">Time</h2>
          <chronometer
            class="text-base min-[600px]:text-2xl min-[1500px]:text-3xl"
          ></chronometer>
        </li>
      </ul>
    </div>
  </main>
</section>

@if(this.controller.gameOver){
<endgame-modal-tetris></endgame-modal-tetris>
} @if(this.controller.isPaused){
<welcome-tetris-modal>></welcome-tetris-modal>
}
