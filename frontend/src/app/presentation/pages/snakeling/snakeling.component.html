<section class="shared-container">
  <app-game-bar title="Snakeling" (pause)="onPress('p')" />

  <!-- On touch screens the snake is steered by swiping anywhere here. -->
  <main #play class="play">
    <dl class="readouts">
      <div class="readout">
        <dt>Score</dt>
        <dd>{{ controller.scoreService.score }}</dd>
      </div>
      @if (timed()) {
      <!-- Time Attack: the clock takes the place of the length. -->
      <div class="readout readout-time" [class.is-hurry]="hurry()">
        <dt>Time</dt>
        <dd>{{ clock() }}</dd>
      </div>
      } @else {
      <div class="readout">
        <dt>Length</dt>
        <dd>{{ length() }}</dd>
      </div>
      }
      <div class="readout readout-end">
        <dt>High Score</dt>
        <dd>{{ controller.bestScore }}</dd>
      </div>
    </dl>

    <!-- The stage is the room the board may use; the canvas is sized
         inside it from the component. -->
    <div #stage class="stage">
      <canvas
        #screen
        class="screen"
        role="img"
        aria-label="Snakeling board"
      ></canvas>
    </div>
  </main>
</section>

@if(this.controller.isGameOver){
<endgame-modal-snakeling></endgame-modal-snakeling>
} @if(this.controller.isPaused){
<welcome-snakeling-modal></welcome-snakeling-modal>
}
