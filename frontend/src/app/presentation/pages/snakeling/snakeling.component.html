<section class="shared-container">
  <app-game-bar title="Snakeling" (pause)="onPress('p')" />

  <main class="play">
    <dl class="readouts">
      <div class="readout">
        <dt>Score</dt>
        <dd>{{ controller.scoreService.score }}</dd>
      </div>
      <div class="readout">
        <dt>Length</dt>
        <dd>{{ length() }}</dd>
      </div>
      <div class="readout readout-end">
        <dt>High Score</dt>
        <dd>{{ controller.scoreService.maxScore }}</dd>
      </div>
    </dl>

    <!-- The stage is the room the board may use; the canvas is sized
         inside it from the component. -->
    <div #stage class="stage">
      <canvas
        #screen
        class="screen"
        role="img"
        aria-label="Snakeling board"
      ></canvas>
    </div>

    <div class="dpad" role="group" aria-label="Move the snake">
      <button
        class="dpad-key dpad-up"
        type="button"
        aria-label="Up"
        (pointerdown)="onPress('w')"
      >
        &uarr;
      </button>
      <button
        class="dpad-key dpad-left"
        type="button"
        aria-label="Left"
        (pointerdown)="onPress('a')"
      >
        &larr;
      </button>
      <button
        class="dpad-key dpad-down"
        type="button"
        aria-label="Down"
        (pointerdown)="onPress('s')"
      >
        &darr;
      </button>
      <button
        class="dpad-key dpad-right"
        type="button"
        aria-label="Right"
        (pointerdown)="onPress('d')"
      >
        &rarr;
      </button>
    </div>
  </main>
</section>

@if(this.controller.isGameOver){
<endgame-modal-snakeling></endgame-modal-snakeling>
} @if(this.controller.isPaused){
<welcome-snakeling-modal [resuming]="started()"></welcome-snakeling-modal>
}
