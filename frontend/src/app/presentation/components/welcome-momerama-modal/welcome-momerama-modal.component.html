<div class="modal-scrim">
  <div
    class="modal modal-bg sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="memorama-dialog-title"
  >
    <h2 id="memorama-dialog-title" class="modal-title-with-bar">
      {{ resuming() ? "Paused" : "How to play" }}
    </h2>

    <!-- The rule, shown: two cards that match, one still face down. -->
    <div class="demo" aria-hidden="true">
      <span class="demo-card is-found">
        <app-pixel-emblem [map]="SAMPLE.emblem" />
      </span>
      <span class="demo-card is-found">
        <app-pixel-emblem [map]="SAMPLE.emblem" />
      </span>
      <span class="demo-card">?</span>
    </div>

    <p class="rule">
      Flip two cards at a time. Find all 6 pairs before the minute runs out.
    </p>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playGame()"
      >
        {{ resuming() ? "Resume Game" : "Play Game" }}
      </button>
    </div>
  </div>
</div>
