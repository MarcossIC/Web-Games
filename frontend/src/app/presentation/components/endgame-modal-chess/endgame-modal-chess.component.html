<div class="modal-scrim">
  <div
    class="modal modal-bg sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="chess-result-title"
  >
    <h2 id="chess-result-title" class="modal-title-with-bar">Round finished</h2>

    <p class="verdict" [ngClass]="verdictClass()">
      {{ isWinner() ? getGameOverTypeMessage() : "It's a tie" }}
    </p>
    @if (!isWinner()) {
    <p class="reason">{{ getGameOverTypeMessage() }}</p>
    }

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playAgain()"
      >
        Play Game
      </button>
    </div>
  </div>
</div>
