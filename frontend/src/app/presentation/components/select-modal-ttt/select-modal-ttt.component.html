<div class="modal-scrim">
  <div
    class="modal modal-bg sheet versus"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ttt-dialog-title"
  >
    <h2 id="ttt-dialog-title" class="modal-title-with-bar">New Game</h2>

    <div class="stage">
      <section class="fighter you" [class.plays-o]="playsO">
        <p class="role">You</p>
        <!-- Each mark is its own element, so switching marks mounts a
             new one and its drawing animation plays again. -->
        <div class="portrait">
          @if (playsO) {
          <app-ttt-mark mark="O" />
          } @else {
          <app-ttt-mark mark="X" />
          }
        </div>
        <fieldset class="group">
          <legend class="sr-only">Play as</legend>
          <div class="segmented">
            <label>
              <input
                type="radio"
                name="ttt-mark"
                [checked]="!playsO"
                (change)="choosePlayer(false)"
              />
              <span>X<span class="sr-only"> Player X</span></span>
            </label>
            <label>
              <input
                type="radio"
                name="ttt-mark"
                [checked]="playsO"
                (change)="choosePlayer(true)"
              />
              <span>O<span class="sr-only"> Player O</span></span>
            </label>
          </div>
        </fieldset>
      </section>

      <p class="vs" aria-hidden="true">VS</p>

      <!-- The rival always gets the mark you did not take. -->
      <section class="fighter rival" [class.plays-o]="!playsO">
        <p class="role">Rival plays {{ playsO ? "X" : "O" }}</p>
        <div class="portrait">
          @if (bot) {
          <app-pixel-emblem class="face" [map]="botFace" />
          } @else {
          <app-pixel-emblem class="face" [map]="FRIEND_FACE" />
          }
        </div>
        <fieldset class="group">
          <legend class="sr-only">Opponent</legend>
          <div class="segmented">
            <label>
              <input
                type="radio"
                name="ttt-opponent"
                [checked]="!bot"
                (change)="chooseOpponent(false)"
              />
              <span>Friend</span>
            </label>
            <label>
              <input
                type="radio"
                name="ttt-opponent"
                [checked]="bot"
                (change)="chooseOpponent(true)"
              />
              <span>Bot</span>
            </label>
          </div>
        </fieldset>
      </section>
    </div>

    <p class="hint" aria-live="polite">
      {{
        bot
          ? "You play against the computer."
          : "Two players take turns on this screen."
      }}
    </p>

    <!-- Only matters with a bot, so it only shows with a bot. -->
    <div class="level" [class.is-open]="bot">
      <fieldset class="group level-options" [disabled]="!bot">
        <legend>Bot Level</legend>
        <div class="meter" [attr.data-level]="level">
          <label>
            <input
              type="radio"
              name="ttt-level"
              [checked]="level === 1"
              (change)="selectBotLevel(1)"
            />
            <span class="bar" [class.is-lit]="level >= 1"></span>
            <span class="bar-name">Rookie</span>
          </label>
          <label>
            <input
              type="radio"
              name="ttt-level"
              [checked]="level === 2"
              (change)="selectBotLevel(2)"
            />
            <span class="bar" [class.is-lit]="level >= 2"></span>
            <span class="bar-name">Normal</span>
          </label>
          <label>
            <input
              type="radio"
              name="ttt-level"
              [checked]="level === 3"
              (change)="selectBotLevel(3)"
            />
            <span class="bar" [class.is-lit]="level >= 3"></span>
            <span class="bar-name">Master</span>
          </label>
        </div>
      </fieldset>
    </div>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playGame()"
      >
        Play Game
      </button>
    </div>
  </div>
</div>
