<div class="modal-scrim">
<div
  class="modal modal-bg sheet"
  role="dialog"
  aria-modal="true"
  aria-labelledby="tetris-dialog-title"
>
  <h2 id="tetris-dialog-title" class="modal-title-with-bar">
    {{ controller.hasStarted ? "Paused" : "How to play" }}
  </h2>

  <dl class="keys">
    <div class="key-row">
      <dt>Move</dt>
      <dd>
        <kbd>A</kbd><kbd>D</kbd>
        <span class="or">or</span>
        <kbd>&larr;</kbd><kbd>&rarr;</kbd>
      </dd>
    </div>
    <div class="key-row">
      <dt>Rotate Piece</dt>
      <dd>
        <kbd>W</kbd>
        <span class="or">or</span>
        <kbd>&uarr;</kbd>
      </dd>
    </div>
    <div class="key-row">
      <dt>Down</dt>
      <dd>
        <kbd>S</kbd>
        <span class="or">or</span>
        <kbd>&darr;</kbd>
      </dd>
    </div>
    <div class="key-row">
      <dt>Pause/Resume</dt>
      <dd>
        <kbd>P</kbd>
        <span class="or">or</span>
        <kbd>Esc</kbd>
      </dd>
    </div>
  </dl>

  <div class="sheet-actions">
    <button class="abstract-button exit-button" type="button" (click)="close()">
      Exit Game
    </button>
    <button
      #play
      class="abstract-button play-button"
      type="button"
      (click)="playGame()"
    >
      {{ controller.hasStarted ? "Resume Game" : "Play Game" }}
    </button>
  </div>
</div>
</div>
