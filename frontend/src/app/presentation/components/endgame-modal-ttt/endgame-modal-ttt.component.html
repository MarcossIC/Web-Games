<div class="modal-scrim">
  <div
    class="modal modal-bg sheet result"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ttt-result-title"
  >
    <h2 id="ttt-result-title" class="modal-title-with-bar">Round finished</h2>

    @if (controller.isXPlayerWinner()) {
    <p class="winner x-winner">X's Player's Won</p>
    } @else if (controller.isOPlayerWinner()) {
    <p class="winner o-winner">O's Player's Won</p>
    } @else if (controller.isDraw()) {
    <p class="winner draw">Draw</p>
    }

    <div class="scoreline">
      <div class="side" [class.is-winner]="controller.isXPlayerWinner()">
        <app-ttt-mark mark="X" />
        <strong>
          <span class="sr-only">Player X score: </span
          >{{ controller.scorePlayerX }}
        </strong>
      </div>
      <p class="vs" aria-hidden="true">VS</p>
      <div class="side side-o" [class.is-winner]="controller.isOPlayerWinner()">
        <strong>
          <span class="sr-only">Player O score: </span
          >{{ controller.scorePlayerO }}
        </strong>
        <app-ttt-mark mark="O" />
      </div>
    </div>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playAgain()"
      >
        Play Game
      </button>
    </div>
  </div>
</div>
