<div class="modal-scrim">
  <div
    class="modal modal-bg sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="snakeling-result-title"
  >
    <h2 id="snakeling-result-title" class="modal-title-with-bar">Game Over</h2>

    <dl class="results">
      <div class="result-row">
        <dt>Score</dt>
        <dd>{{ controller.scoreService.score }}</dd>
      </div>
      <div class="result-row is-best">
        <dt>High Score</dt>
        <dd>{{ controller.scoreService.maxScore }}</dd>
      </div>
    </dl>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playAgain()"
      >
        Play Again
      </button>
    </div>
  </div>
</div>
