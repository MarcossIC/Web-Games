<div class="modal-scrim">
  <div
    class="modal modal-bg sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="chess-dialog-title"
  >
    <h2 id="chess-dialog-title" class="modal-title-with-bar">
      {{ resuming() ? "Paused" : "How to play" }}
    </h2>

    <p class="rule">
      Chess is played on a 64-square board with 16 pieces per player, each with
      unique moves. The goal is to checkmate the opposing king, leaving him with
      no legal moves to escape the attack.
    </p>

    <dl class="keys">
      <div class="key-row">
        <dt>Move history back</dt>
        <dd><kbd>&larr;</kbd></dd>
      </div>
      <div class="key-row">
        <dt>Move history forward</dt>
        <dd><kbd>&rarr;</kbd></dd>
      </div>
      <div class="key-row">
        <dt>Pause/Resume</dt>
        <dd>
          <kbd>P</kbd>
          <span class="or">or</span>
          <kbd>Esc</kbd>
        </dd>
      </div>
    </dl>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playGame()"
      >
        {{ resuming() ? "Resume Game" : "Play Game" }}
      </button>
    </div>
  </div>
</div>
