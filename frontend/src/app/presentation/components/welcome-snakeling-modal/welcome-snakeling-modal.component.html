<div class="modal-scrim">
  <div
    class="modal modal-bg sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="snakeling-dialog-title"
  >
    <h2 id="snakeling-dialog-title" class="modal-title-with-bar">
      {{ resuming() ? "Paused" : "How to play" }}
    </h2>

    <dl class="keys">
      <div class="key-row">
        <dt>Up</dt>
        <dd>
          <kbd>W</kbd>
          <span class="or">or</span>
          <kbd>&uarr;</kbd>
        </dd>
      </div>
      <div class="key-row">
        <dt>Down</dt>
        <dd>
          <kbd>S</kbd>
          <span class="or">or</span>
          <kbd>&darr;</kbd>
        </dd>
      </div>
      <div class="key-row">
        <dt>Left / Right</dt>
        <dd>
          <kbd>A</kbd><kbd>D</kbd>
          <span class="or">or</span>
          <kbd>&larr;</kbd><kbd>&rarr;</kbd>
        </dd>
      </div>
      <div class="key-row">
        <dt>Pause/Resume</dt>
        <dd>
          <kbd>P</kbd>
          <span class="or">or</span>
          <kbd>Esc</kbd>
        </dd>
      </div>
    </dl>

    <div class="sheet-actions">
      <button class="abstract-button exit-button" type="button" (click)="close()">
        Exit Game
      </button>
      <button
        #play
        class="abstract-button play-button"
        type="button"
        (click)="playGame()"
      >
        {{ resuming() ? "Resume Game" : "Play Game" }}
      </button>
    </div>
  </div>
</div>
