<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Ring Out: open rings held together by clips, and a rod in a metal clamp">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ed6c4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2ed6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset=".5" stop-color="#9aa3b5"/>
      <stop offset="1" stop-color="#d6dbe6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#07060d"/>
  <circle cx="320" cy="210" r="210" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <!-- shadows -->
    <g stroke="#04020c" stroke-opacity=".7" stroke-width="26" transform="translate(8 10)">
      <path d="M254 115A95 95 0 1 0 254 285"/>
      <path d="M386 285A95 95 0 1 0 386 115"/>
      <path d="M150 60H520"/>
    </g>
    <!-- orange ring, open to the right -->
    <path d="M254 115A95 95 0 1 0 254 285" stroke="#7f4d1f" stroke-width="26"/>
    <path d="M254 115A95 95 0 1 0 254 285" stroke="#ff9a3d" stroke-width="18"/>
    <path d="M250 112A95 95 0 1 0 250 282" stroke="#ffd7b1" stroke-width="5" stroke-opacity=".85" transform="translate(-3 -3)"/>
    <!-- blue ring, open to the left -->
    <path d="M386 285A95 95 0 1 0 386 115" stroke="#284f80" stroke-width="26"/>
    <path d="M386 285A95 95 0 1 0 386 115" stroke="#4f9dff" stroke-width="18"/>
    <path d="M386 285A95 95 0 1 0 386 115" stroke="#b9d8ff" stroke-width="5" stroke-opacity=".85" transform="translate(-3 -3)"/>
    <!-- arm of the clip -->
    <path d="M285 200H340" stroke="#7f4d1f" stroke-width="16"/>
    <path d="M285 200H340" stroke="#ff9a3d" stroke-width="10"/>
    <!-- green rod -->
    <path d="M150 60H520" stroke="#22704a" stroke-width="26"/>
    <path d="M150 60H520" stroke="#45dc84" stroke-width="18"/>
    <path d="M147 57H517" stroke="#b5f1cf" stroke-width="5" stroke-opacity=".85"/>
    <path d="M488 48L502 60L488 72" stroke="#b5f1cf" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- the clip's sleeve around the blue tube -->
  <rect x="328" y="180" width="30" height="40" rx="8" fill="#ff9a3d" stroke="#7f4d1f" stroke-width="3"/>
  <path d="M336 184V216M350 184V216" stroke="#7f4d1f" stroke-width="2"/>
  <!-- the clamp -->
  <rect x="318" y="34" width="40" height="52" rx="5" fill="url(#steel)" stroke="#4b5266" stroke-width="3"/>
  <circle cx="338" cy="42" r="3" fill="#5b6377"/>
  <circle cx="338" cy="78" r="3" fill="#5b6377"/>
  <!-- shards -->
  <g stroke="#0b0716" stroke-width="2">
    <path d="M540 250l16-6 8 14-12 10-14-6z" fill="#a874ff"/>
    <path d="M565 300l12-2 4 12-12 6-8-8z" fill="#a874ff"/>
    <path d="M520 320l10 4-2 12-12 0-2-10z" fill="#a874ff"/>
    <path d="M590 230l9 3-1 10-10 1-3-8z" fill="#a874ff"/>
  </g>
</svg>
